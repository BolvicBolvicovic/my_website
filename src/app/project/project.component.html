<section id="{{projectPreview.id}}" class="w-full sm:h-screen scroll-mt-32 flex flex-col gap-8 md:flex-row justify-center items-center">
  <div class="mx-2 gap-y-4 sm:w-3/7 flex flex-col items-center sm:items-start">
    <h1 class="text-3xl font-bold">{{projectPreview.name}}</h1>
    <p class="text-sm sm:text-lg w-full">{{projectPreview.description}}</p>
    <p>See more <a class="underline text-sky-500 hover:text-pink-500" href="{{projectPreview.url}}">here</a></p>
  </div>
  <img src="{{projectPreview.img}}" alt="{{projectPreview.name}}" class="rounded-lg shadow-lg sm:w-1/2"/>
</section>
