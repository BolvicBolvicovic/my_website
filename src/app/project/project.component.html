<div id="{{projectPreview.id}}" class="pt-32"></div>
<section class="w-3/4 mx-auto grid gap-8 md:grid-cols-2 items-center">
  <div class="space-y-4">
    <h1 class="text-3xl font-bold">{{projectPreview.name}}</h1>
    <p class="text-lg">{{projectPreview.description}}</p>
    <p>See more <a class="underline text-sky-500 hover:text-pink-500" href="{{projectPreview.url}}">here</a></p>
  </div>
  <img src="{{projectPreview.img}}" alt="{{projectPreview.name}}" class="rounded-lg shadow-lg"/>
</section>
