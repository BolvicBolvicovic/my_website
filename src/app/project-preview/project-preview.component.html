<div class="group relative w-64 h-48 bg-[#cfc8c0] rounded-lg overflow-hidden shadow-md transition-all duration-300 hover:shadow-xl">
  <a 
    href="#{{projectPreview.id}}" 
    class="block w-full h-full"
  >
    <div class="relative w-full h-full">
      <img 
        [src]="projectPreview.img" 
        [alt]="projectPreview.name"
        class="absolute inset-0 w-full h-full object-cover object-center group-hover:scale-110 transition-transform duration-300"
      />
      
      <div class="absolute bottom-0 left-0 right-0 bg-black bg-opacity-50 p-2">
        <h2 class="text-white text-center font-bold text-lg truncate">
          {{ projectPreview.name }}
        </h2>
      </div>
    </div>
  </a>
</div>
